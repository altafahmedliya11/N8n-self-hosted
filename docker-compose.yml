services:

  # --------------------------------
  # PostgreSQL Database
  # --------------------------------
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER}
      POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}
      PGDATA: /var/lib/postgresql/data

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - n8n-network


  # --------------------------------
  # Redis Queue
  # --------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
      interval: 5s
      timeout: 5s
      retries: 10

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    networks:
      - n8n-network


  # --------------------------------
  # n8n Main Instance
  # --------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    environment: &n8n_environment

      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_NON_ROOT_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}

      # Redis Queue
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUEUE_HEALTH_CHECK_ACTIVE: "true"

      # Encryption
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Task Runners
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0

      # Production execution
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

      # Domain configuration
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"

      # Timezone
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - n8n-network


  # --------------------------------
  # Main Instance Task Runner
  # --------------------------------
  n8n-runner:
    image: n8nio/runners:${N8N_VERSION}
    restart: unless-stopped

    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679

    depends_on:
      - n8n

    networks:
      - n8n-network


  # --------------------------------
  # Worker 1
  # --------------------------------
  n8n-worker-1:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped

    command: worker --concurrency=10

    environment: *n8n_environment

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started

    networks:
      - n8n-network


  # --------------------------------
  # Worker 1 Task Runner
  # --------------------------------
  n8n-worker-1-runner:
    image: n8nio/runners:${N8N_VERSION}
    restart: unless-stopped

    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-1:5679

    depends_on:
      - n8n-worker-1

    networks:
      - n8n-network


  # --------------------------------
  # Worker 2
  # --------------------------------
  n8n-worker-2:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped

    command: worker --concurrency=10

    environment: *n8n_environment

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started

    networks:
      - n8n-network


  # --------------------------------
  # Worker 2 Task Runner
  # --------------------------------
  n8n-worker-2-runner:
    image: n8nio/runners:${N8N_VERSION}
    restart: unless-stopped

    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-2:5679

    depends_on:
      - n8n-worker-2

    networks:
      - n8n-network


# --------------------------------
# Persistent Volumes
# --------------------------------
volumes:
  postgres_data:
  redis_data:
  n8n_data:


# --------------------------------
# Internal Network
# --------------------------------
networks:
  n8n-network:
    driver: bridge